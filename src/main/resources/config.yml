language: "en"

http-server:
  enabled: false
  port: 8080
  public-ip: "127.0.0.1" 

discord-webhook:
  url: "" 

resource-pack:
  enabled: true
  url: ""
  sha1: ""
  required: false
  prompt-on-join: true
  kick-on-decline: true
  send-delay-ticks: 20
  warn-if-url-missing: true
  force-prompt-on-join: true
  prompt-message: "<gold>Please accept the resource pack to see the custom emojis!"

pack-generation:
  output-directory: "output"
  file-name: "IconsLoader-ResourcePack.zip"

textures:
  directory: "icons"
  max-file-size-mb: 4
  max-width: 256
  max-height: 256

chat:
  enabled: true
  case-insensitive: true
  token-format: ":{name}:"
  preserve-unknown-tokens: true
  require-permission: true
  anti-spam: true
  cooldown-ms: 1000