name: IconsLoader
version: 3.0.0
main: iconloader.iconLoader.IconLoader
api-version: '1.21'
description: Ultimate Custom Emoji, Icon & Resource Pack Manager.
author: Sayam
softdepend: [PlaceholderAPI]
commands:
  cl:
    description: Main command for IconsLoader
    aliases: [icons, iconsloader]
  emojis:
    description: Open the player emoji picker
    permission: iconsloader.use
permissions:
  iconsloader.admin:
    description: Access all admin commands
    default: op
  iconsloader.use:
    description: Use the player emoji picker
    default: true